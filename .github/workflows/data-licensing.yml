# Licensing gate for any data a submission brings beyond the published
# snapshot.
#
# Added 2026-08-25 (PR for P2b). CONTRIBUTING.md has told contributors since
# July that "CI enforces extra_covariates[].license against an allowlist of
# SPDX identifiers plus a proprietary-licensed escape hatch", and
# submission.py's schema comment said the same. Neither existed. The rules now
# live in heatready_downscaling.licensing and are enforced by
# validate_manifest itself (so the referee rejects a bad license, and so the
# monthly re-scoring path is covered too); this workflow adds the
# reachability half and gives the check its own visible status on a
# submission PR.
#
# permissions: contents: read, and a plain `pull_request` trigger rather than
# `pull_request_target`, matching referee.yml's reasoning: a job that reads
# contributor-authored input must not hold a writable token or repo secrets.
name: Data licensing

# Paths include the GATE itself, not just submissions (code-review finding,
# PR #31). Filtered on submissions alone, a PR that removed an identifier from
# SPDX_ALLOWLIST, or added a library-level data-source block, got no licensing
# run at all -- so a tightening change could never reveal that already-merged
# submissions now violate it.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "submissions/**"
      - "src/heatready_downscaling/licensing.py"
      - "src/heatready_downscaling/submission.py"
      - "src/heatready_downscaling/coastline.py"
      - "scripts/check_data_licensing.py"
      - ".github/workflows/data-licensing.yml"
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "src/heatready_downscaling/licensing.py"
      - "src/heatready_downscaling/submission.py"
      - "src/heatready_downscaling/coastline.py"
      - "scripts/check_data_licensing.py"
      - ".github/workflows/data-licensing.yml"

permissions:
  contents: read

concurrency:
  group: data-licensing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff against the base ref below.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only what this check actually needs. Installing the full
      # geopandas/rasterio/scikit-learn tree for a pyyaml+requests script was
      # wasteful (noted in the PR #31 review) -- and a lighter install is a
      # faster, less flaky gate.
      - name: Install
        run: pip install pyyaml requests

      # Exit 1 is a real licensing violation and fails the job. Exit 2 means
      # every RULE passed but a declared reproducible_fetch URL did not
      # resolve -- reported, and deliberately NOT a failure: a flaky CDN or a
      # runner without egress is not the contributor's fault, and rejecting a
      # correct submission for it would be a false negative on exactly the
      # kind of good-faith entry this program wants.
      # Two passes, for a reason the round-2 review caught: the script's own
      # comment said a CI caller "should pass only the manifests its PR
      # actually touched", and the workflow then invoked it with no paths --
      # documenting the failure instead of fixing it. Widening the paths
      # trigger made it worse, because a dead upstream in an OLD merged
      # submission would produce an unreachable-URL warning on every PR that
      # touched the gate.
      #
      # So: reachability is checked ONLY for the manifests this PR changed,
      # and the whole-corpus sweep runs rules-only (--no-network). A gate
      # tightening therefore still reveals that merged submissions now
      # violate it, without dragging every historical URL along.
      - name: Changed manifests
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "paths=" >> "$GITHUB_OUTPUT"
          else
            paths=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'submissions/*/*/manifest.yaml' | tr '\n' ' ')
            echo "paths=$paths" >> "$GITHUB_OUTPUT"
          fi

      - name: Rules for every submission (no network)
        run: |
          set +e
          python scripts/check_data_licensing.py --no-network
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;;
            3) echo "::warning::A declared data source needs a maintainer licensing decision before promotion. Admissible, but not automatic -- see the log." ; exit 0 ;;
            4) echo "::error::A manifest could not be parsed. This is a YAML/structure problem, not a licensing violation." ; exit 1 ;;
            *) exit "$status" ;;
          esac

      - name: Reachability for the manifests this change touches
        if: steps.changed.outputs.paths != ''
        run: |
          set +e
          python scripts/check_data_licensing.py ${{ steps.changed.outputs.paths }}
          status=$?
          set -e
          case "$status" in
            0) exit 0 ;;
            2)
              echo "::warning::A declared reproducible_fetch URL was unreachable. Every rule passed; see the log."
              exit 0 ;;
            3)
              # NOT a failure -- proprietary-licensed and no-redistribution
              # data are both admissible. But CONTRIBUTING.md promises they
              # "never pass silently", and exiting 0 with no annotation gave
              # an ordinary green tick a maintainer would merge straight past
              # (code-review finding, PR #31).
              echo "::warning::A declared data source needs a maintainer licensing decision before promotion. Admissible, but not automatic -- see the log."
              exit 0 ;;
            4)
              echo "::error::A manifest could not be parsed. This is a YAML/structure problem, not a licensing violation."
              exit 1 ;;
            *) exit "$status" ;;
          esac
