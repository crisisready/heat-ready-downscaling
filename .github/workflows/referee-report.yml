# Posts the referee's result as a PR comment + check-run. SEPARATE from
# referee.yml on purpose: this workflow runs from `main`'s own definition
# (triggered by `workflow_run`, not `pull_request`), so it's the only place
# a writable token exists in this whole flow -- and by the time it runs,
# referee.yml has already finished with a read-only token against
# untrusted PR content. Never merge these two jobs into one `pull_request`-
# triggered workflow; that would hand a writable token to the same job that
# processes contributor-authored input.
name: Referee Report

on:
  workflow_run:
    workflows: ["Referee"]
    types: [completed]

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download referee artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.find(a => a.name === 'referee-result');
            if (!artifact) {
              core.setFailed('referee.yml produced no referee-result artifact -- it likely failed before uploading (e.g. the paths guard).');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner, repo: context.repo.repo,
              artifact_id: artifact.id, archive_format: 'zip',
            });
            fs.writeFileSync('referee-result.zip', Buffer.from(download.data));

      - name: Unzip
        run: unzip -o referee-result.zip -d out

      - name: Post sticky comment + check-run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(fs.readFileSync('out/pr_number.txt', 'utf8').trim(), 10);
            const comment = fs.readFileSync('out/comment.md', 'utf8');
            const provisional = JSON.parse(fs.readFileSync('out/provisional.json', 'utf8'));

            // Sticky comment, keyed by submission_id -- a re-push (synchronize)
            // updates the SAME comment in place rather than piling up a new
            // one per push.
            const marker = `<!-- heatready-referee:${provisional.submission_id} -->`;
            const body = `${marker}\n${comment}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body,
              });
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            // "reject" (hard reject -- schema/identity/snapshot verification
            // failure) and "fail" (tolerance/coverage violation) both fail
            // this required check; "pass" is the only success. A tolerance
            // violation is still a genuine referee failure -- CONTRIBUTING.md
            // is explicit that a submission must reproduce within tolerance,
            // "provisional ranking only" describes the SCORE's authority
            // (never a promotion decision), not whether reproduction itself
            // is required.
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'referee/reproduction', head_sha: pr.head.sha,
              status: 'completed',
              conclusion: provisional.status === 'pass' ? 'success' : 'failure',
              output: {
                title: `Referee: ${provisional.status}`,
                summary: comment.slice(0, 60000),
              },
            });
