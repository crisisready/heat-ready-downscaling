# Validates the model registry, and enforces that status_history is only ever
# appended to.
#
# The append-only half is the reason this is a workflow rather than a unit
# test: a status line records a transition that actually happened, so editing
# or deleting one rewrites history instead of correcting it, and detecting
# that needs the base ref. Same property and same check shape as
# ledger/*.jsonl (see check-ledger-append.yml).
#
# Not paths-filtered on registry/** alone: registry.py, licensing.py and the
# submission reports entries cite as evidence can all invalidate a manifest
# without registry/ changing. The same reasoning as the Tests workflow -- a
# change anywhere can break a contract asserted elsewhere.
name: Registry

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pyyaml jsonschema

      # github.event.before is the PUSH-event base. Without it a direct push to
      # main ran validation only, so history could be rewritten by pushing
      # rather than by a PR -- which is the one path that skips review anyway
      # (code-review finding, PR #33).
      - name: Validate registry and check status_history is append-only
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          set +e
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$base" 2>/dev/null; then
            python scripts/check_registry.py --base-ref "$base"
          else
            echo "::warning::No usable base ref for this event; running validation only. The append-only check did NOT run."
            python scripts/check_registry.py
          fi
          status=$?
          set -e
          # Exit 3 is "valid, but a data source needs a maintainer licensing
          # decision" -- admissible, never automatic, and it has to be VISIBLE
          # on the PR page rather than buried in a green check's log.
          if [ "$status" -eq 3 ]; then
            echo "::warning::A registry entry's data source needs a maintainer licensing decision. Admissible, but not automatic -- see the log."
            exit 0
          fi
          exit "$status"
